<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Meet Recorder</title>
  <link rel="stylesheet" href="base.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="bar">
    <div class="brand"><img src="icons/icon32.png" alt="" width="18" height="18"> Meet Recorder</div>
    <div>
      <button class="icon-btn" id="open-library" title="Recordings" aria-label="Recordings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M10 9.5v5l4-2.5z" fill="currentColor"/></svg>
      </button>
      <button class="icon-btn" id="open-settings" title="Settings" aria-label="Settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>
      </button>
    </div>
  </header>

  <section class="view" id="view-idle" hidden>
    <div class="empty-state">
      <svg class="empty-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="6" width="13" height="12" rx="2"/><path d="m15.5 10.5 6-3.5v10l-6-3.5"/></svg>
      <h2>No meeting in this tab</h2>
      <p>Join a call on Google Meet, then click this icon to start recording.</p>
      <button class="btn" id="idle-library">View recordings</button>
    </div>
  </section>

  <section class="view" id="view-ready" hidden>
    <div>
      <div class="eyebrow">Ready to record</div>
      <div class="meeting-title" id="ready-title"></div>
    </div>
    <div class="options">
      <label class="option">
        <span><strong>My microphone</strong><small id="mic-hint">Include your own voice</small></span>
        <input type="checkbox" class="switch" id="opt-mic">
      </label>
      <label class="option">
        <span><strong>Video</strong><small>Turn off to record audio only</small></span>
        <input type="checkbox" class="switch" id="opt-video">
      </label>
      <label class="option">
        <span><strong>Turn on captions</strong><small>Meet's captions become the transcript</small></span>
        <input type="checkbox" class="switch" id="opt-captions">
      </label>
    </div>
    <button class="btn btn-record" id="start"><span class="dot"></span><span>Start recording</span></button>
    <p class="note">Let everyone in the call know you're recording.</p>
  </section>

  <section class="view" id="view-recording" hidden>
    <div class="rec-head">
      <span class="rec-dot" aria-hidden="true"></span>
      <span class="rec-time" id="rec-time">00:00</span>
      <span class="rec-title" id="rec-title"></span>
    </div>
    <div class="chips"><span class="chip" id="chip-mic"></span><span class="chip" id="chip-captions"></span></div>
    <ul class="warnings" id="warnings"></ul>
    <div class="live" id="live" aria-live="polite"></div>
    <div class="row">
      <button class="btn" id="goto-tab" hidden>Go to meeting</button>
      <button class="btn btn-stop" id="stop"><span class="square"></span><span>Stop &amp; save</span></button>
    </div>
  </section>

  <p class="banner banner-error" id="error" hidden></p>
  <script type="module" src="popup.js"></script>
</body>
</html>
